[package]
name = "sleepsafe"
version = "0.1.0"
edition = "2021"
authors = ["elmiranda-cl"]
description = "Intelligent thermal and closed-lid sleep protection for Windows laptops"
license = "MIT"
repository = "https://github.com/ciae/sleepsafe"
readme = "README.md"
keywords = ["laptop", "sleep", "thermal", "battery", "windows"]
categories = ["os::windows-apis", "hardware-support"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Power",
    "Win32_System_SystemServices",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_Registry",
] }
