<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background / Drop Shadows -->
    <filter id="shadow-shield" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#020617" flood-opacity="0.6"/>
    </filter>
    <filter id="shadow-laptop" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#020617" flood-opacity="0.5"/>
    </filter>
    <filter id="glow-ice" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="laptop-screen-bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <linearGradient id="laptop-display" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0A192F"/>
    </linearGradient>

    <radialGradient id="display-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="laptop-base-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="40%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <linearGradient id="laptop-base-lip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Shield Gradients -->
    <linearGradient id="shield-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="30%" stop-color="#38BDF8"/>
      <stop offset="70%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <linearGradient id="shield-body-left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="25%" stop-color="#0284C7"/>
      <stop offset="65%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>

    <linearGradient id="shield-body-right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="35%" stop-color="#0369A1"/>
      <stop offset="75%" stop-color="#0C4A6E"/>
      <stop offset="100%" stop-color="#082F49"/>
    </linearGradient>

    <linearGradient id="shield-specular" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#38BDF8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </linearGradient>

    <!-- Snowflake Gradient -->
    <linearGradient id="snow-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
  </defs>

  <!-- ==================== 1. LAPTOP ==================== -->
  <g id="laptop-group" filter="url(#shadow-laptop)">
    <!-- Screen Outer Bezel -->
    <rect x="42" y="32" width="172" height="114" rx="8" fill="url(#laptop-screen-bezel)" stroke="#475569" stroke-width="1.5"/>

    <!-- Screen Inner Display -->
    <rect x="50" y="40" width="156" height="98" rx="4" fill="url(#laptop-display)"/>
    <!-- Subtle cool display ambient glow -->
    <rect x="50" y="40" width="156" height="98" rx="4" fill="url(#display-glow)"/>

    <!-- Screen top webcam dot -->
    <circle cx="128" cy="36" r="1.5" fill="#0F172A"/>

    <!-- Laptop Base Top Deck (Trapezoid) -->
    <polygon points="26,146 230,146 244,170 12,170" fill="url(#laptop-base-top)"/>

    <!-- Keyboard subtle recessed outline -->
    <polygon points="46,148 210,148 218,160 38,160" fill="#1E293B" opacity="0.65"/>

    <!-- Trackpad subtle outline -->
    <rect x="110" y="162" width="36" height="6" rx="1" fill="#334155" opacity="0.6"/>

    <!-- Laptop Front Lip / Bevel -->
    <polygon points="12,170 244,170 238,178 18,178" fill="url(#laptop-base-lip)"/>
    <!-- Center thumb opening indent -->
    <rect x="114" y="170" width="28" height="2.5" rx="1" fill="#475569"/>

    <!-- Cool Thermal Status LED strip in base -->
    <rect x="118" y="146.5" width="20" height="2" rx="1" fill="#38BDF8" opacity="0.85"/>
  </g>

  <!-- ==================== 2. SHIELD ==================== -->
  <g id="shield-group" filter="url(#shadow-shield)">
    <!-- Outer Shield Stroke / Rim -->
    <!-- Shield path: Top curves gracefully from (68, 76) up to (128, 70) down to (188, 76), sides curve to (128, 226) -->
    <path d="M 68 76 C 96 70 128 70 128 70 C 128 70 160 70 188 76 C 194 135 174 196 128 226 C 82 196 62 135 68 76 Z"
          fill="url(#shield-border)" stroke="#BAE6FD" stroke-width="2" stroke-linejoin="round"/>

    <!-- Inner Shield Left Half (Bright highlight side) -->
    <path d="M 72 79 C 98 74 128 74 128 74 L 128 221 C 86 193 68 136 72 79 Z"
          fill="url(#shield-body-left)"/>

    <!-- Inner Shield Right Half (Deep shadow side) -->
    <path d="M 128 74 C 158 74 184 79 184 79 C 188 136 170 193 128 221 Z"
          fill="url(#shield-body-right)"/>

    <!-- Shield Specular Gloss Highlight (Curved glass reflection top-left) -->
    <path d="M 74 81 C 96 76 126 76 126 76 L 126 150 C 92 135 78 105 74 81 Z"
          fill="url(#shield-specular)"/>

    <!-- Shield Inner Frost Rim -->
    <path d="M 74 81 C 98 76 128 76 128 76 C 128 76 158 76 182 81 C 185 133 167 186 128 214 C 89 186 71 133 74 81 Z"
          fill="none" stroke="#7DD3FC" stroke-width="1.2" stroke-opacity="0.4"/>
  </g>

  <!-- ==================== 3. SNOWFLAKE ==================== -->
  <g id="snowflake-group" filter="url(#glow-ice)" stroke="url(#snow-grad)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Snowflake Center: (128, 142) -->
    <g transform="translate(128, 142)">
      <!-- Hexagonal Center Ring -->
      <polygon points="0,-7 6,-3.5 6,3.5 0,7 -6,3.5 -6,-3.5"
               fill="#38BDF8" fill-opacity="0.4" stroke="#FFFFFF" stroke-width="1.8"/>
      <!-- Center jewel dot -->
      <circle cx="0" cy="0" r="2.2" fill="#FFFFFF"/>

      <!-- 6 Radial Arms (every 60 degrees) -->
      <!-- Arm 1 (0 deg - UP) -->
      <g>
        <line x1="0" y1="-7" x2="0" y2="-34" stroke-width="2.6"/>
        <polyline points="-7,-18 0,-25 7,-18" stroke-width="2.2" fill="none"/>
        <polyline points="-5,-26 0,-31 5,-26" stroke-width="1.8" fill="none"/>
        <circle cx="0" cy="-35.5" r="1.5" fill="#FFFFFF"/>
      </g>

      <!-- Arm 2 (60 deg - UP-RIGHT) -->
      <g transform="rotate(60)">
        <line x1="0" y1="-7" x2="0" y2="-34" stroke-width="2.6"/>
        <polyline points="-7,-18 0,-25 7,-18" stroke-width="2.2" fill="none"/>
        <polyline points="-5,-26 0,-31 5,-26" stroke-width="1.8" fill="none"/>
        <circle cx="0" cy="-35.5" r="1.5" fill="#FFFFFF"/>
      </g>

      <!-- Arm 3 (120 deg - DOWN-RIGHT) -->
      <g transform="rotate(120)">
        <line x1="0" y1="-7" x2="0" y2="-34" stroke-width="2.6"/>
        <polyline points="-7,-18 0,-25 7,-18" stroke-width="2.2" fill="none"/>
        <polyline points="-5,-26 0,-31 5,-26" stroke-width="1.8" fill="none"/>
        <circle cx="0" cy="-35.5" r="1.5" fill="#FFFFFF"/>
      </g>

      <!-- Arm 4 (180 deg - DOWN) -->
      <g transform="rotate(180)">
        <line x1="0" y1="-7" x2="0" y2="-34" stroke-width="2.6"/>
        <polyline points="-7,-18 0,-25 7,-18" stroke-width="2.2" fill="none"/>
        <polyline points="-5,-26 0,-31 5,-26" stroke-width="1.8" fill="none"/>
        <circle cx="0" cy="-35.5" r="1.5" fill="#FFFFFF"/>
      </g>

      <!-- Arm 5 (240 deg - DOWN-LEFT) -->
      <g transform="rotate(240)">
        <line x1="0" y1="-7" x2="0" y2="-34" stroke-width="2.6"/>
        <polyline points="-7,-18 0,-25 7,-18" stroke-width="2.2" fill="none"/>
        <polyline points="-5,-26 0,-31 5,-26" stroke-width="1.8" fill="none"/>
        <circle cx="0" cy="-35.5" r="1.5" fill="#FFFFFF"/>
      </g>

      <!-- Arm 6 (300 deg - UP-LEFT) -->
      <g transform="rotate(300)">
        <line x1="0" y1="-7" x2="0" y2="-34" stroke-width="2.6"/>
        <polyline points="-7,-18 0,-25 7,-18" stroke-width="2.2" fill="none"/>
        <polyline points="-5,-26 0,-31 5,-26" stroke-width="1.8" fill="none"/>
        <circle cx="0" cy="-35.5" r="1.5" fill="#FFFFFF"/>
      </g>
    </g>
  </g>
</svg>
