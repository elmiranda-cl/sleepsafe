ShortDescription: Intelligent thermal and closed-lid sleep protection for Windows laptops to prevent Backpack Oven Syndrome.
Description: |
  SleepSafe is an ultra-lightweight Windows utility that prevents laptops from overheating inside backpacks.
  When a laptop is unplugged while the lid is already closed, Windows Modern Standby often fails to sleep properly, turning the machine into a hot oven.
  SleepSafe monitors the thermal gradient and lid sensor, allowing safe docking with external monitors, but immediately suspending the laptop if trapped inside a bag or exceeding safe temperatures.
